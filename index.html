<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> BookMark 🥑 - by Tanishtha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> My BookMarks </h1>

    <h2> Mostly Used</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Link</th>
            <th>Icon</th>
        </tr>


        <tr>
            <td>Google</td>
            <td><a target="_blank" href="https://www.google.com">Google</a></td>
            <td><img height="150" src="google.png" alt="google"></td>
        </tr>

        <tr>
            <td>Youtube</td>
            <td><a target="_blank" href="https://www.youtube.com">Youtube</a></td>
            <td><img height="150" src="youtube.png" alt="youtube"></td>
        </tr>

        <tr>
            <td>Pinterest</td>
            <td><a target="_blank" href="https://www.pinterest.com">Pinterest</a></td>
            <td><img height="150" src="pin.png" alt="pin"></td>
        </tr>

    </table>
    
    <h2> Not Frequently Used</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Link</th>
            <th>Icon</th>
        </tr>


        <tr>
            <td>Wikipedia</td>
            <td><a target="_blank" href="https://www.wikipedia.com">Wikipedia</a></td>
            <td><img height="150" src="wiki.png" alt="wiki"></td>
        </tr>
    </table>

</body>
</html>
