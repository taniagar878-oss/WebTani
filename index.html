<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> BookMark 🥑 - by Tanishtha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> My BookMarks </h1>

    <table>
        <caption>Mostly Used</caption>

        <thead>
            <tr>
                <th colspan="2">Name</th>
                <th colspan="3">Link</th>
                <th colspan="4">Icon</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td colspan="2">Google</td>
                <td colspan="3"><a target="_blank" href="https://www.google.com">Google</a></td>
                <td colspan="4"><img height="150" src="google.png" alt="google"></td>
            </tr>

            <tr>
                <td colspan="2">Youtube</td>
                <td colspan="3"><a target="_blank" href="https://www.youtube.com">Youtube</a></td>
                <td colspan="4"><img height="150" src="youtube.png" alt="youtube"></td>
            </tr>

            <tr>
                <td colspan="2">Pinterest</td>
                <td colspan="3"><a target="_blank" href="https://www.pinterest.com">Pinterest</a></td>
                <td colspan="4"><img height="150" src="pin.png" alt="pin"></td>
            </tr>

        </tbody>

        <tfoot>
            footer
        </tfoot>

    </table>
    

    <table>
        <caption>Not Frequently Used</caption>

        <thead>
            <tr>
                <th colspan="2">Name</th>
                <th colspan="3">Link</th>
                <th colspan="4">Icon</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td colspan="2">Wikipedia</td>
                <td colspan="3"><a target="_blank" href="https://www.wikipedia.com">Wikipedia</a></td>
                <td colspan="4"><img height="150" src="wiki.png" alt="wiki"></td>
            </tr>
        </tbody>
        

        <tfoot>
            footer
        </tfoot>

    </table>

    <ul type="square">
        <li>Pinterest</li>
        <li>Google</li>
        <li>Youtube</li>
    </ul>
    <dd>
        <dt>Pinterest</dt>
        <dd>my fav</dd>
        <dt>Google</dt>
        <dd>very imp</dd>
        <dt>Youtube</dt>
        <dd>mostly used</dd>
    </dd>
    <ol type="I">
        <li>Wikipedia</li>
        <li>Forbes</li>
    </ol>

</body>
</html>
